<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Speech Bubble Frame -->
  <path d="M32 6C17.64 6 6 16.75 6 30c0 5.4 1.95 10.39 5.29 14.41L8.5 56.5l13.12-3.88C24.77 53.64 28.27 54 32 54c14.36 0 26-10.75 26-24S46.36 6 32 6z" 
        stroke="url(#bubbleGrad)" stroke-width="3" fill="#0f172a" fill-opacity="0.85" filter="url(#glow)"/>

  <!-- Left Code Bracket '{' -->
  <path d="M19 22c-2 0-3 1.5-3 3.5v2c0 1.5-1 2.5-2.5 2.5 1.5 0 2.5 1 2.5 2.5v2c0 2 1 3.5 3 3.5" 
        stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Code Bracket '}' -->
  <path d="M45 22c2 0 3 1.5 3 3.5v2c0 1.5 1 2.5 2.5 2.5-1.5 0-2.5 1-2.5 2.5v2c0 2-1 3.5-3 3.5" 
        stroke="#c084fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neural Network Connections -->
  <line x1="32" y1="21" x2="25" y2="30" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.85"/>
  <line x1="32" y1="21" x2="39" y2="30" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.85"/>
  <line x1="25" y1="30" x2="32" y2="38" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.85"/>
  <line x1="39" y1="30" x2="32" y2="38" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.85"/>
  <line x1="25" y1="30" x2="39" y2="30" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="2 2" stroke-opacity="0.6"/>

  <!-- Neural Network Nodes (Glowing Circles) -->
  <circle cx="32" cy="21" r="3.6" fill="url(#nodeGrad)"/>
  <circle cx="25" cy="30" r="3.2" fill="url(#nodeGrad)"/>
  <circle cx="39" cy="30" r="3.2" fill="url(#nodeGrad)"/>
  <circle cx="32" cy="38" r="3.6" fill="url(#nodeGrad)"/>

  <!-- Center Core Node -->
  <circle cx="32" cy="29.5" r="2" fill="#ffffff"/>
</svg>